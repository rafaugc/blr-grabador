name: Descubrir circuitos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 6'   # cada sábado a mediodía (hay más circuitos emitiendo)

permissions:
  contents: write

jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m grabador.descubrir
      - name: Subir resultado
        run: |
          git config user.name "blr-grabador"
          git config user.email "blr-grabador@users.noreply.github.com"
          git add data/circuitos_detectados.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Circuitos detectados $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done
